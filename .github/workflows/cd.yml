
name: Users - CD

'on':
  workflow_run:
    workflows:
      - Users - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish-ecr:
    name: Publicar imagem no ECR
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::043089701673:role/GitHubActions-FCG-Users-ECR
          aws-region: us-east-1

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e publicar imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fiap-cloud-games-users
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --provenance=false \
            --sbom=false \
            -f Api/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./Api

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configurar acesso ao EKS
        run: |
          aws eks update-kubeconfig \
            --name fiap-cloud-games \
            --region us-east-1

      - name: Atualizar Users API no EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl set image deployment/users-api \
            users-api="$ECR_REGISTRY/fiap-cloud-games-users:$IMAGE_TAG" \
            --namespace default

          kubectl rollout status deployment/users-api \
            --namespace default \
            --timeout=180s

